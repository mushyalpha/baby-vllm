[project]
name = "babyvllm"
version = "0.1.0"
description = "A lightweight vLLM-style inference engine built from scratch"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "huggingface_hub",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["babyvllm*"]
